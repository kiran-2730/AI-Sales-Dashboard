<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Sales Dashboard</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">
<h2>AI Sales</h2>

<ul>
<li>Dashboard</li>
<li>Analytics</li>
<li>Prediction</li>
</ul>
</div>

<!-- ================= MAIN ================= -->

<div class="main">

<h1>Sales Dashboard</h1>

<!-- ===== KPI CARDS ===== -->

<div class="cards">

<div class="card">
<h3>Top Product</h3>
<p id="topProduct">Loading...</p>
</div>

<div class="card">
<h3>Total Regions</h3>
<p>4 Active</p>
</div>

<div class="card">
<h3>AI Prediction</h3>
<p>Enabled </p>
</div>

</div>

<!-- ===== CHARTS ===== -->

<div class="charts">

<div class="chart-card">
<h3>Revenue by Region</h3>
<canvas id="regionChart"></canvas>
</div>

<div class="chart-card">
<h3>Monthly Trend</h3>
<canvas id="monthlyChart"></canvas>
</div>

</div>

<div class="prediction">

<h2>Predict Sales</h2>

<div class="form-grid">

<select id="shipMode">
<option>Standard Class</option>
<option>Second Class</option>
<option>First Class</option>
<option>Same Day</option>
</select>

<select id="segment">
<option>Consumer</option>
<option>Corporate</option>
<option>Home Office</option>
</select>

<select id="category">
<option>Furniture</option>
<option>Office Supplies</option>
<option>Technology</option>
</select>

<input id="subCategory" placeholder="Sub Category">

<select id="region">
<option>West</option>
<option>East</option>
<option>Central</option>
<option>South</option>
</select>

<input type="number" id="quantity" placeholder="Quantity">

<input type="number" step="0.01"
id="discount" placeholder="Discount">

<input type="date" id="orderDate">

<input type="number"
id="shipping" placeholder="Shipping Days">

</div>

<button onclick="predictSales()">
Predict Sales
</button>

<h2 id="prediction"></h2>

</div>

</div>
</div>

<script src="script.js"></script>

</body>
</html>
